name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  link-check:
    name: Link Checker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Link Checker
        uses: lycheeverse/lychee-action@v1
        with:
          args: --verbose --no-progress './**/*.md'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  type-check:
    name: Type Check (Node.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install
      - name: Type check backend
        run: pnpm --filter ./backend exec tsc --noEmit
      - name: Type check frontend
        run: pnpm --filter ./frontend exec tsc --noEmit
      - name: Run tests
        run: pnpm test
      - name: Build Node.js workspaces
        run: pnpm build

  python-check:
    name: Python Lint Check (AI Service)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ai-services/requirements.txt
          pip install ruff
      - name: Lint with Ruff
        run: ruff check ai-services
      - name: Validate Python source
        run: python -m compileall -q ai-services
